<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GanjaFlare Daily Lotto 🎰</title>
    <style>
        /* 社長が元々設定されていた背景色やデザインの雰囲気に戻しています */
        body {
            background-color: #0b141a; /* 元の落ち着いたダークカラー */
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #15222e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 { color: #fff; margin-bottom: 20px; }
        
        /* 元のアドレス入力欄 */
        .address-input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #30475e;
            background-color: #222831;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 元のスタートボタン */
        .btn-start {
            background-color: #00adb5;
            color: #fff;
            border: none;
            padding: 14px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-start:hover { background-color: #008c95; }

        /* 🎥 宝箱の演出動画エリア */
        .video-container {
            display: none;
            margin: 20px auto;
            max-width: 100%;
        }
        video {
            width: 100%;
            border-radius: 8px;
        }

        /* 🎁 結果表示エリア */
        .result-box {
            display: none;
            margin-top: 25px;
        }
        .result-img {
            max-width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .btn-share {
            display: inline-block;
            background-color: #1d9bf0;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            font-weight: bold;
            border-radius: 25px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GanjaFlare Daily Lotto</h1>
    <p>ウォレットアドレスを入力して宝箱を開けよう！</p>
    
    <input type="text" id="userWalletAddress" class="address-input" placeholder="0xから始まるアドレスを入力してください">
    <br>
    <button id="startButton" class="btn-start" onclick="startLotto()">🎰 START 🎰</button>

    <div id="videoContainer" class="video-container">
        <video id="lottoVideo" src="./chest_open.mp4" muted playsinline></video>
    </div>

    <div id="resultBox" class="result-box">
        <h2 id="resultTitle"></h2>
        <img id="resultImage" class="result-img" src="" alt="Result">
        <br>
        <a id="shareXButton" class="btn-share" href="#" target="_blank">𝕏 結果をポストして広める！</a>
    </div>
</div>

<script>
    function startLotto() {
        const address = document.getElementById("userWalletAddress").value.trim();
        if (!address.startsWith("0x") || address.length !== 42) {
            alert("正しいウォレットアドレスを入力してください。");
            return;
        }

        // 画面をすっきりさせて動画演出を開始
        document.getElementById("startButton").style.display = "none";
        document.getElementById("resultBox").style.display = "none";
        const videoContainer = document.getElementById("videoContainer");
        const video = document.getElementById("lottoVideo");

        videoContainer.style.display = "block";
        video.currentTime = 0;
        video.play();

        // 🎥 動画が再生終了（終わったら結果を出す元のフロー）
        video.onended = function() {
            videoContainer.style.display = "none";
            document.getElementById("startButton").style.display = "inline-block";
            
            // 確率計算を実行
            determineResult();
        };
    }

    function determineResult() {
        const randomNumber = Math.random() * 100;
        let tier = "No Luck";

        if (randomNumber < 0.5) {
            tier = "Mythic";
        } else if (randomNumber < 2.0) {
            tier = "Legendary";
        } else if (randomNumber < 7.0) {
            tier = "Epic";
        } else if (randomNumber < 20.0) {
            tier = "Rare";
        } else if (randomNumber < 50.0) {
            tier = "Common";
        } else {
            tier = "No Luck";
        }

        showFinalResult(tier);
    }

    function showFinalResult(tier) {
        // 等賞ごとのデータ設定
        const tierData = {
            "Mythic": { title: "💎 🎉 MYTHIC WIN!", file: "mythic", text: "Hits the Mythic chest in the Daily Lotto and simulated winning 2,000 $GANJA!" },
            "Legendary": { title: "✨ 🔥 LEGENDARY WIN!", file: "legendary", text: "Hits the Legendary chest in the Daily Lotto and simulated winning 500 $GANJA!" },
            "Epic": { title: "✨ ⚡ EPIC WIN!", file: "epic", text: "Hits the Epic chest in the Daily Lotto and simulated winning 100 $GANJA!" },
            "Rare": { title: "🎁 🔷 RARE WIN!", file: "rare", text: "Hits the Rare chest in the Daily Lotto and simulated winning 30 $GANJA!" },
            "Common": { title: "🎰 🟢 COMMON WIN!", file: "common", text: "Hits the Common chest in the Daily Lotto and simulated winning 10 $GANJA!" },
            "No Luck": { title: "👀 🎰 No Luck Today", file: "noluck", text: "Played the GanjaFlare Daily Lotto today! Better luck tomorrow!" }
        };

        const result = tierData[tier];

        document.getElementById("resultTitle").innerText = result.title;
        document.getElementById("resultImage").src = `./${result.file}.jpg`;
        
        // 𝕏 (X)のシェアリンク（先ほど作成した専用小文字HTMLへの動的リンク）
        const shareUrl = `https://ganjaflare-lotto.vercel.app/${result.file}.html`;
        const postText = `${result.title}\n\n${result.text}\n\n▼ Play Here:\n`;
        
        document.getElementById("shareXButton").href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(postText)}&url=${encodeURIComponent(shareUrl)}`;
        document.getElementById("resultBox").style.display = "block";
    }
</script>

</body>
</html>
