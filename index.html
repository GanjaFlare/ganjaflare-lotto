<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GanjaFlare Daily Lotto</title>

    <meta property="og:url" content="https://sites.google.com/view/ganjaflareen/home?authuser=0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="GanjaFlare Daily Lotto 🎰">
    <meta property="og:description" content="Open the lucky chest daily at 12:00 UTC and win up to 2,000 $GANJA!">
    <meta property="og:image" content="https://ganjaflare-lotto.vercel.app/ogp-image.jpg?v=2">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="GanjaFlare Daily Lotto 🎰">
    <meta name="twitter:description" content="Open the lucky chest daily at 12:00 UTC and win up to 2,000 $GANJA!">
    <meta name="twitter:image" content="https://ganjaflare-lotto.vercel.app/ogp-image.jpg?v=2">

    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-glow: rgba(52, 211, 153, 0.3);
            --border-glow-focus: rgba(52, 211, 153, 0.8);
            --emerald: #34d399;
            --purple: #a855f7;
            --pink: #ff007f;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(52, 211, 153, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 1) 0%, rgba(10, 15, 30, 1) 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        #loadingOverlay {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999; 
            justify-content: center; 
            align-items: center;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.1), 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        h1 { 
            font-size: 24px; 
            margin-top: 0; 
            margin-bottom: 25px; 
            color: var(--text-main); 
            font-weight: 800; 
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, var(--emerald) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.3);
        }

        .input-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }

        label { 
            display: block; 
            font-size: 13px; 
            margin-bottom: 8px; 
            color: var(--text-sub); 
            font-weight: 600; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: 12px; 
            border: 1px solid var(--border-glow); 
            background-color: rgba(15, 23, 42, 0.8); 
            color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px; 
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus { 
            outline: none; 
            border-color: var(--emerald); 
            background-color: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 15px rgba(52, 211, 153, 0.3), inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .chest-box { 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            margin: 0 auto 25px auto; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(52, 211, 153, 0.2);
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        .result-image-box { 
            width: 100%; 
            margin-bottom: 20px; 
            border-radius: 16px; 
            overflow: hidden; 
            display: none; 
            border: 1px solid var(--border-glow);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2); 
        }

        #resultImgTag { 
            width: 100%; 
            height: auto; 
            display: block; 
        }

        .btn-open { 
            background: linear-gradient(135deg, var(--emerald) 0%, #10b981 50%, var(--purple) 100%); 
            color: #0f172a; 
            border: none; 
            padding: 16px 24px; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px; 
            font-weight: 800; 
            letter-spacing: 0.5px;
            border-radius: 30px; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.4); 
            transition: all 0.3s ease;
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.7), 0 0 15px rgba(168, 85, 247, 0.5);
            color: #ffffff;
        }

        .btn-open:active { 
            transform: translateY(1px) scale(0.98); 
        }

        .btn-share-x { 
            background: #000000; 
            color: var(--text-main); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            padding: 14px 20px; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 15px; 
            font-weight: 700; 
            border-radius: 30px; 
            cursor: pointer; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 12px; 
            transition: all 0.3s ease;
        }

        .btn-share-x:hover {
            border-color: var(--text-main);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .result-screen { 
            display: none; 
            margin-top: 20px; 
        }

        #game-form { 
            display: none; 
        }

        #login-area p {
            color: var(--text-sub) !important;
        }

        #userEmail {
            color: var(--emerald);
            text-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
        }

        #resultAmount {
            font-size: 18px; 
            color: var(--text-main) !important; 
            font-weight: 700; 
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
        }

        @media (max-width: 480px) { 
            body { padding: 10px; } 
            .container { padding: 25px 18px; border-radius: 20px; } 
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <img src="niku.gif" style="width: 150px; height: 150px;">
</div>

<div class="container">
    <h1>GanjaFlare Daily Lotto</h1>
    
    <div id="login-area">
        <p style="margin-bottom: 25px; font-size: 14px; line-height: 1.5;">Please sign in with Google to play the daily lotto.</p>
        <div id="g_id_onload" data-client_id="53876794554-8tdrpeeopmkmmv8tuicav3gev3724fd8.apps.googleusercontent.com" data-context="signin" data-ux_mode="popup" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black" data-text="signin_with" data-size="large" data-logo_alignment="left" style="display: flex; justify-content: center;"></div>
    </div>
    
    <div id="game-form">
        <div class="input-group">
            <label>Wallet address</label>
            <input type="text" id="walletAddress" placeholder="0x...">
        </div>
        
        <div class="chest-box">
            <video id="chestVideo" src="chest0820.mp4" playsinline muted></video>
        </div>

        <button class="btn-open" id="openBtn" onclick="startLotto()">OPEN CHEST</button>
        
        <div style="margin-top: 25px; margin-bottom: 5px; font-size: 13px; color: var(--text-sub); font-weight: 600; word-break: break-all;">
            Logged in as: <span id="userEmail">---</span>
        </div>
    </div>

    <div class="result-screen" id="resultScreen">
        <div class="result-image-box" id="resultImageBox">
            <img src="" alt="Result" id="resultImgTag">
        </div>

        <div id="resultAmount"></div>
        
        <button class="btn-share-x" id="shareBtn" onclick="shareOnX()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            Share on X
        </button>

        <button class="btn-open" onclick="resetGame()">PLAY AGAIN</button>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    let userLoggedInEmail = "";
    let lastLottoTier = "";
    let lastLottoAmount = 0;
    let shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app"; 

    function parseJwt(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
        const payload = parseJwt(response.credential);
        userLoggedInEmail = payload.email;
        document.getElementById('userEmail').innerText = userLoggedInEmail;
        document.getElementById('login-area').style.display = 'none';
        document.getElementById('game-form').style.display = 'block';
    }

    async function startLotto() {
        const address = document.getElementById('walletAddress').value;
        if (!address) { alert('Please enter your wallet address!'); return; }

        document.getElementById('loadingOverlay').style.display = 'flex';

        try {
            const response = await fetch('https://ganjaflare-lotto-backend.onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ walletAddress: address, email: userLoggedInEmail })
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Failed to play lotto");

            document.getElementById('loadingOverlay').style.display = 'none';
            const video = document.getElementById('chestVideo');
            video.play();

            video.onended = () => {
                document.getElementById('game-form').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';
                const imgBox = document.getElementById('resultImageBox');
                const imgTag = document.getElementById('resultImgTag');
                imgBox.style.display = 'block';

                const tiers = { "Mythic": "mythic.jpg", "Legendary": "legendary.jpg", "Epic": "epic.jpg", "Rare": "rare.jpg", "Common": "common.jpg", "No Luck": "noluck.jpg" };
                imgTag.src = tiers[result.tier] || "common.jpg";
                
                const labels = { 
                    "Mythic": "🎉 You won 2,000 $GANJA! 🎉", 
                    "Legendary": "🔥 You won 500 $GANJA! 🔥", 
                    "Epic": "✨ You won 100 $GANJA! ✨", 
                    "Rare": "You won 30 $GANJA!", 
                    "Common": "You won 10 $GANJA!",
                    "No Luck": "Better luck tomorrow!" 
                };
                document.getElementById('resultAmount').innerText = labels[result.tier] || "Better luck tomorrow!";
                
                lastLottoTier = result.tier;
                lastLottoAmount = result.amount;
                
                const tierUrl = result.tier.toLowerCase().replace(" ", "");
                shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app/" + tierUrl + ".html";
            };
        } catch (error) {
            document.getElementById('loadingOverlay').style.display = 'none';
            alert(error.message);
            resetGame();
        }
    }

    function shareOnX() {
    const messageText = `🎰 Played the GanjaFlare Daily Lotto!\n\n${lastLottoTier === 'No Luck' || lastLottoAmount === 0 ? 'Better luck tomorrow!' : 'Hits the ' + lastLottoTier + ' chest and won ' + lastLottoAmount + ' $GANJA!'}`;
    const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(messageText)}&url=${encodeURIComponent(shareUrlForThisResult)}`;
    window.open(xUrl, '_blank'); 
}

    function resetGame() {
        document.getElementById('game-form').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('loadingOverlay').style.display = 'none';
        const video = document.getElementById('chestVideo');
        video.currentTime = 0; video.pause();
    }
</script>
</body>
</html>
