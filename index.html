<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GanjaFlare Daily Lotto</title>

    <meta property="og:url" content="https://sites.google.com/view/ganjaflareen/home?authuser=0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="GanjaFlare Daily Lotto 🎰">
    <meta property="og:description" content="Open the lucky chest daily at 12:00 UTC and win up to 2,000 $GANJA!">
    <meta property="og:image" content="https://ganjaflare-lotto.vercel.app/ogp-image.jpg">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="GanjaFlare Daily Lotto 🎰">
    <meta name="twitter:description" content="Open the lucky chest daily at 12:00 UTC and win up to 2,000 $GANJA!">
    <meta name="twitter:image" content="https://ganjaflare-lotto.vercel.app/ogp-image.jpg">

    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #f5f7fb;
            color: #1a1d20;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        .container {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 22px;
            margin-top: 5px;
            margin-bottom: 25px;
            color: #2e7d32;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #636e72;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #dcdde1;
            background-color: #fafbfc;
            color: #1a1d20;
            font-size: 15px;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        input:focus {
            outline: none;
            border-color: #2e7d32;
            background-color: #ffffff;
        }
        .chest-box {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .result-image-box {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #resultImgTag {
            width: 100%;
            height: auto;
            display: block;
        }
        .btn-open {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(46,125,50,0.2);
            transition: transform 0.2s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-open:active { transform: scale(0.98); }
        .btn-share-x {
            background: #000000;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .countdown-timer {
            margin-top: 10px;
            font-size: 13px;
            color: #c0392b;
            font-weight: bold;
        }
        .result-screen {
            display: none;
            margin-top: 20px;
        }
        #game-form { display: none; }
        @media (max-width: 480px) {
            body { padding: 5px; }
            .container {
                padding: 20px 15px;
                border-radius: 15px;
                border: none;
                box-shadow: none;
            }
            h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GanjaFlare Daily Lotto</h1>
    
    <div id="login-area">
        <p style="color: #636e72; margin-bottom: 25px; font-size: 14px; line-height: 1.4;">Please sign in with Google to play the daily lotto.</p>
        
        <div id="g_id_onload"
             data-client_id="53876794554-8tdrpeeopmkmmv8tuicav3gev3724fd8.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
             data-type="standard"
             data-shape="pill"
             data-theme="outline"
             data-text="signin_with"
             data-size="large"
             data-logo_alignment="left"
             style="display: flex; justify-content: center;">
        </div>
    </div>
    
    <div id="game-form">
        <div class="input-group">
            <label>Wallet address</label>
            <input type="text" id="walletAddress" placeholder="0x...">
        </div>
        
        <div class="chest-box">
            <video id="chestVideo" src="chest.mp4" playsinline muted></video>
        </div>

        <button class="btn-open" id="openBtn" onclick="startLotto()">OPEN CHEST</button>
        
        <div style="margin-top: 25px; margin-bottom: 5px; font-size: 13px; color: #2e7d32; font-weight: bold; word-break: break-all;">
            Logged in as: <span id="userEmail">---</span>
        </div>

        <div class="countdown-timer" id="countdownTimer">You can play once daily. Resets at 12:00 UTC!</div>
    </div>

    <div class="result-screen" id="resultScreen">
        <div class="result-image-box" id="resultImageBox">
            <img src="" alt="Result" id="resultImgTag">
        </div>

        <div id="resultAmount" style="font-size: 16px; color: #1a1d20; font-weight: 500; margin-bottom: 25px;"></div>
        
        <button class="btn-share-x" id="shareBtn" onclick="shareOnX()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            Share on X
        </button>

        <button class="btn-open" onclick="resetGame()">PLAY AGAIN</button>
    </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
    let userLoggedInEmail = "";
    let lastLottoTier = "";
    let lastLottoAmount = 0;
    let shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app"; 

    function parseJwt(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
        try {
            const responsePayload = parseJwt(response.credential);
            userLoggedInEmail = responsePayload.email;
            
            document.getElementById('userEmail').innerText = userLoggedInEmail;
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('game-form').style.display = 'block';

            const video = document.getElementById('chestVideo');
            video.load();
            video.currentTime = 0;
        } catch (err) {
            console.error("Google Auth Parse Error:", err);
            alert("Failed to sign in with Google.");
        }
    }

    async function startLotto() {
        const address = document.getElementById('walletAddress').value;

        if (!address) {
            alert('Please enter your wallet address!');
            return;
        }

        document.getElementById('openBtn').disabled = true;
        document.getElementById('walletAddress').disabled = true;
        document.getElementById('openBtn').innerText = "ROLLING...";

        try {
            // 🌐 正しい本番のRenderサーバーを呼び出します
            const response = await fetch('https://ganjaflare-lotto-backend.onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    walletAddress: address,
                    email: userLoggedInEmail
                })
            });

            let result = await response.json();

            if (!response.ok) {
    alert(result.error || "Failed to play lotto");
    resetGame();
    return;
            }

            const video = document.getElementById('chestVideo');
            video.play();

            video.onended = () => {
                document.getElementById('game-form').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';

                const imgBox = document.getElementById('resultImageBox');
                const imgTag = document.getElementById('resultImgTag');
                imgBox.style.display = 'block';

                const tier = result.tier;
                const amount = result.amount;
                let amountText = "";

                // 🎯 確実に各結果の専用HTMLのURLに切り替えます
                if (tier === "Mythic") {
                    amountText = "🎉 You won 2,000 $GANJA! 🎉";
                    imgTag.src = "mythic.jpg";
                    shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app/mythic.html";
                } else if (tier === "Legendary") {
                    amountText = "🔥 You won 500 $GANJA! 🔥";
                    imgTag.src = "legendary.jpg";
                    shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app/legendary.html";
                } else if (tier === "Epic") {
                    amountText = "✨ You won 100 $GANJA! ✨";
                    imgTag.src = "epic.jpg";
                    shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app/epic.html";
                } else if (tier === "Rare") {
                    amountText = "You won 30 $GANJA!";
                    imgTag.src = "rare.jpg";
                    shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app/rare.html";
                } else if (tier === "Common") {
                    amountText = "You won 10 $GANJA!";
                    imgTag.src = "common.jpg";
                    shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app/common.html";
                } else {
                    amountText = "Better luck tomorrow!";
                    imgTag.src = "noluck.jpg";
                    shareUrlForThisResult = "https://ganjaflare-lotto.vercel.app/noluck.html";
                }
                
                lastLottoTier = tier;
                lastLottoAmount = amount;
                document.getElementById('resultAmount').innerText = amountText;
            };

        } catch (error) {
            console.error("Lotto Fetch Error:", error);
            alert("Connection error. Please try again.");
            resetGame();
        }
    }

    function shareOnX() {
        const tagsText = "#GanjaFlare #FlareNetwork $GANJA $FLR $XRP";
        const messageText = `🎰 Played the GanjaFlare Daily Lotto!\n\n${lastLottoTier === 'No Luck' || lastLottoAmount === 0 ? 'Better luck tomorrow!' : 'Hits the ' + lastLottoTier + ' chest and won ' + lastLottoAmount + ' $GANJA!'}\n\n${tagsText}`;

        const xUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(messageText)}&url=${encodeURIComponent(shareUrlForThisResult)}`;
        window.open(xUrl, '_blank'); 
    }

    function resetGame() {
        document.getElementById('game-form').style.display = 'block';
        document.getElementById('resultScreen').style.display = 'none';
        
        const openBtn = document.getElementById('openBtn');
        const walletInput = document.getElementById('walletAddress');
        openBtn.disabled = false;
        openBtn.innerText = "OPEN CHEST";
        walletInput.disabled = false;
        
        const video = document.getElementById('chestVideo');
        video.currentTime = 0;
        video.pause();

        document.getElementById('resultImageBox').style.display = 'none';
        document.getElementById('resultImgTag').src = "";
    }
</script>

</body>
</html>
