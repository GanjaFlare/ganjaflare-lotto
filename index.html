<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GanjaFlare Daily Lotto</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // 🔥 Firebase管理画面から取得した設定をここに！
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = () => {
            signInWithPopup(auth, provider).catch(err => alert("Login Error: " + err.message));
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-area').style.display = 'none';
                document.getElementById('game-form').style.display = 'block';
                document.getElementById('userEmail').innerText = user.email;
                window.loggedInEmail = user.email;
            }
        });
    </script>

    <style>
        body { background-color: #f5f7fb; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .container { background: #fff; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        #game-form, #resultScreen { display: none; }
        .btn-google { background: #4285F4; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn-open { background: #2e7d32; color: white; padding: 15px; border: none; border-radius: 30px; width: 100%; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>GanjaFlare Daily Lotto</h1>
    
    <div id="login-area">
        <button class="btn-google" onclick="loginWithGoogle()">Sign in with Google</button>
    </div>
    
    <div id="game-form">
        <input type="text" id="walletAddress" placeholder="Enter Wallet Address" style="width:100%; padding:10px; border-radius:8px;">
        <button class="btn-open" id="openBtn" onclick="startLotto()">OPEN CHEST</button>
        <p style="font-size: 12px; margin-top:15px;">Logged in as: <span id="userEmail"></span></p>
    </div>

    <div id="resultScreen">
        <h2 id="resultAmount"></h2>
        <button class="btn-open" onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<script>
    window.loggedInEmail = "";

    async function startLotto() {
        const address = document.getElementById('walletAddress').value;
        if (!address) return alert('Enter your wallet address');

        document.getElementById('openBtn').innerText = "ROLLING...";

        try {
            const response = await fetch('/api/lotto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ walletAddress: address, email: window.loggedInEmail })
            });

            const result = await response.json();
            if (!response.ok) throw new Error(result.error);

            document.getElementById('game-form').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('resultAmount').innerText = "Winner! You got: " + result.amount + " $GANJA";
        } catch (error) {
            alert(error.message);
            document.getElementById('openBtn').innerText = "OPEN CHEST";
        }
    }
</script>
</body>
</html>
