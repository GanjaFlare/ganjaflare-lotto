<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GanjaFlare Daily Lotto 🎰</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e0036 0%, #11001c 100%);
            color: #fff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { color: #00ffcc; font-size: 2.5em; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0,255,204,0.5); }
        p { color: #bbb; font-size: 1.1em; }
        
        .btn-lotto {
            background: linear-gradient(45deg, #00ffcc, #0099ff);
            color: #11001c;
            border: none;
            padding: 18px 40px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
            margin: 20px auto;
            display: block;
        }
        .btn-lotto:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 255, 204, 0.6); }

        .result-box { display: none; margin-top: 30px; animation: fadeIn 1s ease; }
        .result-img { max-width: 100%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .btn-share {
            display: inline-block;
            background-color: #1d9bf0;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(29, 155, 240, 0.4);
            transition: all 0.3s ease;
        }
        .btn-share:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(29, 155, 240, 0.6); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>GanjaFlare Daily Lotto</h1>
    <p>Test your luck today and win simulated $GANJA!</p>
    
    <button id="lottoButton" class="btn-lotto" onclick="playLotto()">🎰 OPEN CHEST 🎰</button>

    <div id="resultBox" class="result-box">
        <h2 id="resultTitle" style="color: #fff;"></h2>
        <img id="resultImage" class="result-img" src="" alt="Result">
        <br>
        <a id="shareXButton" class="btn-share" href="#" target="_blank">𝕏 Share on X to Spread the Word!</a>
    </div>
</div>

<script>
    function playLotto() {
        // 🎲 ブラウザ側で安全に確率計算（以前のロジックを100%継承）
        const randomNumber = Math.random() * 100;
        let tier = "No Luck";

        if (randomNumber < 0.5) {
            tier = "Mythic";
        } else if (randomNumber < 2.0) {
            tier = "Legendary";
        } else if (randomNumber < 7.0) {
            tier = "Epic";
        } else if (randomNumber < 20.0) {
            tier = "Rare";
        } else if (randomNumber < 50.0) {
            tier = "Common";
        } else {
            tier = "No Luck";
        }

        showFinalResult(tier);
    }

    function showFinalResult(tier) {
        const tierData = {
            "Mythic": { title: "💎 🎉 MYTHIC WIN!", file: "mythic", text: "Hits the Mythic chest in the Daily Lotto and simulated winning 2,000 $GANJA!" },
            "Legendary": { title: "✨ 🔥 LEGENDARY WIN!", file: "legendary", text: "Hits the Legendary chest in the Daily Lotto and simulated winning 500 $GANJA!" },
            "Epic": { title: "✨ ⚡ EPIC WIN!", file: "epic", text: "Hits the Epic chest in the Daily Lotto and simulated winning 100 $GANJA!" },
            "Rare": { title: "🎁 🔷 RARE WIN!", file: "rare", text: "Hits the Rare chest in the Daily Lotto and simulated winning 30 $GANJA!" },
            "Common": { title: "🎰 🟢 COMMON WIN!", file: "common", text: "Hits the Common chest in the Daily Lotto and simulated winning 10 $GANJA!" },
            "No Luck": { title: "👀 🎰 No Luck Today", file: "noluck", text: "Played the GanjaFlare Daily Lotto today! Better luck tomorrow!" }
        };

        const result = tierData[tier];

        document.getElementById("resultTitle").innerText = result.title;
        document.getElementById("resultImage").src = `./${result.file}.jpg`;
        
        // 𝕏 (X)のシェアリンク（作った小文字HTMLとバチッと連動）
        const shareUrl = `https://ganjaflare-lotto.vercel.app/${result.file}.html`;
        const postText = `${result.title}\n\n${result.text}\n\n▼ Play Here:\n`;
        
        document.getElementById("shareXButton").href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(postText)}&url=${encodeURIComponent(shareUrl)}`;
        document.getElementById("resultBox").style.display = "block";
    }
</script>

</body>
</html>
